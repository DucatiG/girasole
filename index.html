<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El ángulo del girasol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF5EA; --panel:#EFE6D2; --ink:#1E2440; --muted:#4E5468; --sun:#F2B33D; --sun-ink:#93590A;
  --seed-a:#E39A2B; --seed-b:#B5701A; --line:rgba(30,36,64,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E2440; --panel:#2A3256; --ink:#FAF5EA; --muted:#C9CDE0; --sun:#F2B33D; --sun-ink:#F2B33D;
    --seed-a:#F2B33D; --seed-b:#D98A1F; --line:rgba(250,245,234,.2);
  }
}
:root[data-theme="dark"]{
  --bg:#1E2440; --panel:#2A3256; --ink:#FAF5EA; --muted:#C9CDE0; --sun:#F2B33D; --sun-ink:#F2B33D;
  --seed-a:#F2B33D; --seed-b:#D98A1F; --line:rgba(250,245,234,.2);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:18px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:clamp(16px,3vw,40px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;min-height:100vh}
.stage{position:relative;aspect-ratio:1/1;width:100%;max-width:min(78vh,720px);justify-self:center}
canvas{width:100%;height:100%;display:block}
h1{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-weight:600;font-size:clamp(28px,3.4vw,44px);line-height:1.1;margin:0 0 .4em}
.lead{color:var(--muted);margin:0 0 1.4em;max-width:34ch}
.readout{display:flex;align-items:baseline;gap:.3em;margin-bottom:.3em}
.big{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-weight:600;font-size:clamp(64px,9vw,120px);line-height:1;color:var(--sun-ink);font-variant-numeric:tabular-nums}
.deg{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:clamp(32px,4vw,56px);color:var(--sun-ink)}
.hint{min-height:1.5em;color:var(--muted);margin:0 0 1.2em;font-weight:700}
label{display:block;font-weight:700;margin:1.1em 0 .4em}
.row{display:flex;gap:12px;align-items:center}
input[type=range]{flex:1;accent-color:var(--sun);height:32px}
input[type=number]{width:6.5em;font:inherit;font-weight:700;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:.4em}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer}
button[aria-pressed="true"]{background:var(--sun);color:#1E2440;border-color:var(--sun)}
button.grow{background:var(--ink);color:var(--bg);border-color:var(--ink);margin-top:1.4em}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);min-height:auto}
  .stage{max-width:520px}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="stage"><canvas id="c" aria-label="Semillas de girasol colocadas según el ángulo elegido" role="img"></canvas></div>
  <section>
    <h1>El ángulo del girasol</h1>
    <p class="lead">Cada semilla nueva gira un ángulo respecto a la anterior. Elige el ángulo y mira qué pasa.</p>
    <div class="readout"><span class="big" id="big">137,5</span><span class="deg">°</span></div>
    <p class="hint" id="hint"></p>

    <label for="ang">Ángulo de giro</label>
    <div class="row">
      <input type="range" id="ang" min="0" max="360" step="0.1" value="137.5">
      <input type="number" id="num" min="0" max="360" step="0.1" value="137.5" aria-label="Escribe el ángulo">
    </div>
    <div class="chips" id="chips">
      <button data-a="90">90°</button>
      <button data-a="120">120°</button>
      <button data-a="135">135°</button>
      <button data-a="137.5">137,5°</button>
      <button data-a="140">140°</button>
    </div>

    <label for="n">Número de semillas: <span id="nOut">600</span></label>
    <input type="range" id="n" min="50" max="1500" step="10" value="600" style="width:100%">

    <button class="grow" id="grow">Ver crecer la flor</button>
  </section>
</main>
<script>
(function(){
  var c=document.getElementById('c'),ctx=c.getContext('2d');
  var ang=document.getElementById('ang'),num=document.getElementById('num'),big=document.getElementById('big'),hint=document.getElementById('hint');
  var nIn=document.getElementById('n'),nOut=document.getElementById('nOut'),chips=document.querySelectorAll('#chips button'),grow=document.getElementById('grow');
  var state={a:137.5,n:600,shown:600},anim=null;
  var notes={'90':'1/4 de vuelta: 4 filas rectas','120':'1/3 de vuelta: 3 filas y mucho espacio vacío','135':'3/8 de vuelta: 8 filas','137.5':'El ángulo de oro: ningún hueco','140':'Muy cerca… pero vuelven los huecos'};
  function fmt(a){return (Math.round(a*10)/10).toString().replace('.',',')}
  function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
  function size(){var r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);draw()}
  function draw(){
    var W=c.width,H=c.height,cx=W/2,cy=H/2,R=Math.min(W,H)/2*0.96;
    ctx.clearRect(0,0,W,H);
    var N=state.n,k=R/Math.sqrt(N),A=state.a*Math.PI/180,ca=css('--seed-a'),cb=css('--seed-b');
    var base=k*0.42;
    for(var i=1;i<=state.shown;i++){
      var r=k*Math.sqrt(i),t=i*A;
      ctx.beginPath();
      ctx.arc(cx+r*Math.cos(t),cy+r*Math.sin(t),base*(0.7+0.5*i/N),0,6.2832);
      ctx.fillStyle=i%2?ca:cb;ctx.fill();
    }
  }
  function setAngle(a,src){
    a=Math.max(0,Math.min(360,+a||0));state.a=a;
    if(src!=='range')ang.value=a;
    if(src!=='num')num.value=Math.round(a*10)/10;
    big.textContent=fmt(a);
    var key=String(Math.round(a*10)/10);hint.textContent=notes[key]||'';
    chips.forEach(function(b){b.setAttribute('aria-pressed',String(+b.dataset.a===Math.round(a*10)/10))});
    draw();
  }
  ang.addEventListener('input',function(){setAngle(ang.value,'range')});
  num.addEventListener('input',function(){if(num.value!=='')setAngle(num.value,'num')});
  chips.forEach(function(b){b.addEventListener('click',function(){setAngle(b.dataset.a)})});
  nIn.addEventListener('input',function(){state.n=+nIn.value;state.shown=state.n;nOut.textContent=state.n;if(anim){cancelAnimationFrame(anim);anim=null}draw()});
  grow.addEventListener('click',function(){
    if(anim)cancelAnimationFrame(anim);
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){state.shown=state.n;draw();return}
    state.shown=0;var start=null,dur=Math.min(6000,1500+state.n*4);
    function step(ts){if(!start)start=ts;var p=Math.min(1,(ts-start)/dur);state.shown=Math.round(state.n*p);draw();if(p<1)anim=requestAnimationFrame(step);else anim=null}
    anim=requestAnimationFrame(step);
  });
  window.addEventListener('resize',size);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
  new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  setAngle(137.5);size();
})();
</script>
</body>
</html>
